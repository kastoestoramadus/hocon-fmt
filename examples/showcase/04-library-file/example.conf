title: "A real library file"
story: "Apache Pekko opens its reference configuration with a licence and banner above blank lines. The command line takes the leading block verbatim as a preserved preamble; the playground fork keeps the same comments through its carrier. Either way the excerpt is already formatted."
shows: "A verbatim Apache-2.0 Pekko licence header and version include, kept byte for byte."
target: "formatted"
now: "already-formatted"
reason-if-different: "The licence header survives verbatim as a preserved preamble (docs/limitations.md) and the excerpt already formats, so nothing is written — 'formatted' is the target and the formatted text equals the input. Upstream, sconfig still drops the block until #647 is released."
options: [default]
findings: []
source {
  kind: verbatim
  pattern: "First 11 lines, unchanged, including final newline"
  url: "https://github.com/apache/pekko/blob/1dd51690af2fdb317fec4241cd476c83aac4e768/actor/src/main/resources/reference.conf"
  sha: "1dd51690af2fdb317fec4241cd476c83aac4e768"
  licence: "Apache-2.0"
}
now-site: "formatted"

upstream {
  issue: "https://github.com/ekrich/sconfig/issues/646"
  fix: "https://github.com/ekrich/sconfig/pull/647"
  state: "Open draft, awaiting the maintainer."
