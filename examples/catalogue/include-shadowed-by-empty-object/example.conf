title: "An empty object erasing the included value"
story: "`scalar.conf` defines x as a scalar and `x {}` follows it: an object replaces the scalar, so the file resolves x to an empty object. Nothing of the empty object survives in the value tree, so formatting would drop the line — and the include's scalar would be what x resolves to. The included file cannot be read at format time, so the formatter refuses and names the two lines to look at."
shows: "an empty object is kept from vanishing when an include may be what it replaced"
target: "refused:shadowed-by-include"
now: "refused:shadowed-by-include"
source: {
  kind: distilled
  pattern: "docs/research/formatters/REPORT.md B2: `x.a = 5`, the include, `x {}`, with scalar.conf defining `x = 3`"
}
