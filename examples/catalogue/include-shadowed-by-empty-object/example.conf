title: "An empty object erasing the included value"
story: "`scalar.conf` defines `x`, and `x.a = 5` with `x {}` around the include rewrites it. The document engine keeps every line as written, and which definition wins is decided when the config resolves, not when it formats, so the file formats and the duplicate report still names the dead entry."
shows: "the document engine keeps every definition around an include; nothing is dropped at format time"
target: "formatted"
now: "formatted"
