title: "A comment at the end of an object"
story: "A comment sits after the last field of a nested object, with no field after it. Sconfig attaches a comment to the field following it and drops one that attaches to nothing, so the formatter refuses rather than lose it."
shows: "a trailing comment inside an object would be lost, so the file is left unchanged"
target: "formatted"
now: "refused:lost-comment"
reason-if-different: "docs/limitations.md, 'a comment no field follows': the comment is attached to no field and sconfig drops it on rendering."
