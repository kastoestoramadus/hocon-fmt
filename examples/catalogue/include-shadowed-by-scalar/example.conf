title: "A scalar erasing the included object"
story: "`f.conf` defines o, and `o = 3` erases it while `o.c = 7` replaces that scalar. The value tree sconfig renders holds only `o.c`, so formatting would drop the erasing line — and the included `o.retained` would then merge into `o.c`, which the file resolves away today. The included file cannot be read at format time, so the formatter refuses and names the two lines to look at."
shows: "a definition that may be what keeps the included file's values out of a key is refused rather than dropped"
target: "refused:shadowed-by-include"
now: "refused:shadowed-by-include"
