title: "A scalar erasing the included object"
story: "`f.conf` defines o, and `o = 3` with `o.c = 7` rewrites it. The document engine keeps every line as written, and which definition wins is decided when the config resolves, not when it formats, so the file formats and the duplicate report still names the dead entry."
shows: "the document engine keeps every definition around an include; nothing is dropped at format time"
target: "formatted"
now: "formatted"
source: {
  kind: distilled
  pattern: "docs/research/formatters/REPORT.md B1: `include \"f.conf\"`, `o = 3`, `o.c = 7`, with f.conf defining `o.retained`"
}
