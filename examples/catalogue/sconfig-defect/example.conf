title: "A known sconfig defect"
story: "An array assignment is followed by HOCON append syntax for the same path. Released sconfig renders the combined value as text it cannot parse again, so the command line and the plugins refuse the broken output; this page runs a development build of sconfig that renders it, so the playground formats it."
shows: "released sconfig renders this as text it cannot read back, so the CLI refuses it; the page's development build formats it — one of the bugs listed in the contributions below"
target: "formatted"
now: "refused:broken-output"
reason-if-different: "Sconfig renders the array append expression as output it cannot parse again; the formatter refuses that upstream defect to avoid corrupting the file."
source: {
  kind: synthetic
  pattern: "Array assignment followed by append syntax"
}
options: [default]

playground-order: 5

upstream {
  issue: "https://github.com/ekrich/sconfig/pull/598"
  fix: "https://github.com/ekrich/sconfig/pull/598"
  state: "Our fix is merged upstream; waiting for a release."
}
