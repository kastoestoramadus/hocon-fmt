title: "A header comment above a blank line"
story: "A licence banner opens the file, and a blank line separates it from the first key. Sconfig attaches a comment to the field after it, so the banner attaches to nothing and is dropped, and the formatter refuses to lose it."
shows: "the most common real-world refusal: a banner detached from the first key by a blank line would be lost"
target: "formatted"
now: "refused:lost-comment"
reason-if-different: "docs/limitations.md, 'a comment a blank line follows': sconfig drops a comment the blank line detaches from the next key, so nearly every banner-header file in the corpus is refused until sconfig renders it."
source: {
  kind: distilled
  pattern: "Header comment block detached from the first key by a blank line (report shape A: 351 Play/Akka skeleton banners plus 62 bare-hash banners)"
  seen-in: 413
}
options: [default]
