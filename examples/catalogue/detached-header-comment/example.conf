title: "A header comment above a blank line"
story: "A banner comment opens the file, and a blank line separates it from the first key. Released sconfig attaches a comment only to the field below it and would drop the banner; the formatter takes the leading block verbatim as a preserved preamble, so the file is already as it should be and is left exactly as it is."
shows: "the most common real-world header: a banner detached from the first key by a blank line, kept verbatim"
target: "formatted"
now: "already-formatted"
reason-if-different: "docs/limitations.md, 'the preserved preamble': the banner survives verbatim and the body already formats, so nothing is written — 'formatted' is the target, and the formatted text equals the input. Upstream, sconfig still drops the block until #647 is released."
source: {
  kind: distilled
  pattern: "Header comment block detached from the first key by a blank line (report shape A: 351 Play/Akka skeleton banners plus 62 bare-hash banners)"
  seen-in: 413
}
options: [default]

upstream {
  issue: "https://github.com/ekrich/sconfig/issues/646"
  fix: "https://github.com/ekrich/sconfig/pull/647"
  state: "Open draft; the command line keeps the block itself now, and the option would hand the attachment to sconfig."
}
