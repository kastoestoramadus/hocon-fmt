title: "An env override inside an object"
story: "A key is defined twice inside an object, the second value an optional env substitution: the standard defaults-then-environment override idiom. Sconfig renders the merged values with an unresolved-merge banner, and a second formatting pass would grow the file again."
shows: "the most idiomatic override pattern is refused: the merged output would change on every pass"
target: "formatted"
now: "refused:unstable-output"
reason-if-different: "ekrich/sconfig#598 and #600: sconfig renders the unresolved merge of a default value and an optional env substitution as a banner that parses but is not a fixed point; the formatter refuses so the file is never rewritten."
source: {
  kind: distilled
  pattern: "Duplicate key whose second value is an optional env substitution, inside an object (report section 3.2)"
  seen-in: 200
}
