title: "A comment at the end of an object"
story: "A comment sits at the end of an object with no field after it. Sconfig attaches a comment to the field following it and drops one that attaches to nothing, so the formatter refuses rather than lose it."
shows: "a trailing comment inside an object would be lost, so the file is left unchanged"
target: "formatted"
now: "refused:lost-comment"
reason-if-different: "docs/limitations.md, 'a comment no field follows': the comment is attached to no field and sconfig drops it on rendering."
source: {
  kind: distilled
  pattern: "Trailing comment at the end of an object, no field after it (report shape B; the remainder of the 818 lost-comment refusals after shape A's 413)"
  seen-in: 405
}
options: [default]

upstream {
