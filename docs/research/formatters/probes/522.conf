title: "A field on the include's line"
story: "An include directive and a field share one line, and sconfig orders fields by the line they start on, leaving fields on one line in no defined order. Rendering could carry the field across the include, where a later definition wins, so the formatter refuses rather than resolve the file to other values."
shows: "a field sharing a line with an include is refused rather than moved across it"
target: "formatted"
now: "refused:moved-include"
reason-if-different: "kastoestoramadus/hocon-fmt#33: sconfig orders same-line fields arbitrarily, so rendering could move zone across the include and change what the file resolves to; on its own line the include formats."
source: {
  kind: synthetic
  pattern: "An include directive sharing a line with a field"
}
options: [default]
