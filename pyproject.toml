# pre-commit installs a Python hook repository with `pip install .`; this makes that an empty
# package. The formatter is the hocon-fmt wheel named in .pre-commit-hooks.yaml.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hocon-fmt-pre-commit-hooks"
version = "0"
requires-python = ">=3.8"

[tool.setuptools]
packages = []
py-modules = []
