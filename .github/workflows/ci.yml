name: CI

on:
  push:
    branches: [main]
  # No branch filter: every pull request is verified, including ones stacked on
  # another feature branch. Pushes are limited to main so a PR branch is not built twice.
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      # ubuntu-24.04 runners no longer ship sbt.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Covers every runtime: core on the JVM, Scala.js and Scala Native, and the cli.
      # Ubuntu runners ship Node for Scala.js and clang for Scala Native.
      - name: Compile and test
        run: sbt test
        env:
          # Every platform builds and tests in one JVM here, and the Scala Native linker runs last
          # in it; sbt's default heap is not enough for that run (cliNative/Test/nativeLink ran
          # out of heap once the site module linked alongside the rest).
          SBT_OPTS: -Xmx4g

      # Runs even when the tests fail, so one run reports both signals.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: sbt scalafmtCheckAll scalafmtSbtCheck

  sbt-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Scripted tests
        run: sbt sbtPluginTest

  gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: gradle/actions/setup-gradle@v4
      # The plugin resolves the Java API, and the core through it, from Maven Local until they are
      # on Maven Central.
      - name: Publish the core and the Java API locally
        run: sbt coreJVM/publishM2 javaApi/publishM2
      - name: Functional tests
        working-directory: gradle-plugin
        run: ./gradlew check

  java-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: gradle/actions/setup-gradle@v4
      # One sbt run publishes the core and the API: the library resolves the core from Maven Local
      # until it is on Maven Central, and sbt builds and publishes the artifact itself; the run
      # also compiles the javadoc jar, and the contract suite in the Gradle build loads exactly
      # this published jar.
      - name: Publish the core and the Java API locally
        run: sbt coreJVM/publishM2 javaApi/publishM2
      - name: Java and Kotlin tests
        working-directory: java-api
        run: ./gradlew check

  maven-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: sbt/setup-sbt@v1
      # The plugin resolves the Java API, and the core through it, from Maven Local until they are
      # on Maven Central.
      - name: Publish the core and the Java API locally
        run: sbt coreJVM/publishM2 javaApi/publishM2
      - name: Integration tests
        working-directory: maven-plugin
        run: ./mvnw -B verify

  mill-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The plugin resolves the core from the local Ivy repository until it is on Maven Central.
      - name: Publish the core locally
        run: sbt coreJVM/publishLocal
      - name: Unit and integration tests
        working-directory: mill-plugin
        run: ./mill --ticker false __.testForked

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pre-commit
      - name: Hooks end to end
        run: scripts/pre-commit-e2e.sh

  # The command line contract on a real process, on every runtime. CmdApiSpec runs in the test JVM
  # and cannot see locale, streams or exit codes.
  cli-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # Links the Scala.js and Scala Native builds, and runs the suite against all three runtimes.
      - name: Acceptance tests
        run: sbt -batch acceptance/test

  # Report-only: shared runners are too noisy to fail a build on. main keeps the history in
  # refs/notes/benchmarks; a pull request is compared against it in the job summary.
  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BENCH_MACHINE: github-ubuntu-latest
      # A note is a commit on refs/notes/benchmarks, and a runner has no git identity of its own.
      GIT_AUTHOR_NAME: github-actions
      GIT_AUTHOR_EMAIL: github-actions@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions
      GIT_COMMITTER_EMAIL: github-actions@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Fetch the history
        run: git fetch origin refs/notes/benchmarks:refs/notes/benchmarks || echo "no history yet"
      - name: Measure
        run: scripts/bench.py run
      - name: Report
        run: |
          {
            echo '```'
            scripts/bench.py report --commits 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push origin refs/notes/benchmarks

  # Report-only, like the benchmarks: coverage records which statements the tests reached, not
  # whether the assertions would notice a change, so it is not a required check and no threshold
  # fails it. JVM only: dotty's coverage runtime needs java.util.UUID over java.security.SecureRandom,
  # which the Scala.js and Scala Native javalibs do not carry, so those links fail instrumented.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Instrumented tests
        run: sbt coverageJvm
      - name: Publish the HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: scoverage-html
          path: |
            core/jvm/target/scala-*/scoverage-report
            cli/.jvm/target/scala-*/scoverage-report
            cats/.jvm/target/scala-*/scoverage-report
            zio/jvm/target/scala-*/scoverage-report
            target/scala-*/scoverage-report
      # Runs even when the tests fail, so one run reports both signals; the script prints a
      # dash for any module whose report is missing.
      - name: Summarise per module
        if: ${{ !cancelled() }}
        run: scripts/coverage-summary.py >> "$GITHUB_STEP_SUMMARY"
