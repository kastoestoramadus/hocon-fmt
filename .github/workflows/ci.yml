name: CI

on:
  push:
    branches: [main]
  # No branch filter: every pull request is verified, including ones stacked on
  # another feature branch. Pushes are limited to main so a PR branch is not built twice.
  pull_request:

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt

      # ubuntu-24.04 runners no longer ship sbt.
      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # Covers every runtime: core on the JVM, Scala.js and Scala Native, and the cli.
      # Ubuntu runners ship Node for Scala.js and clang for Scala Native.
      - name: Compile and test
        run: sbt test

      # Runs even when the tests fail, so one run reports both signals.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: sbt scalafmtCheckAll

  sbt-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Scripted tests
        run: sbt sbtPluginTest

  gradle-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: gradle/actions/setup-gradle@v4
      # The plugin resolves the core from Maven Local until it is on Maven Central.
      - name: Publish the core locally
        run: sbt coreJVM/publishM2
      - name: Functional tests
        working-directory: gradle-plugin
        run: ./gradlew check

  maven-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: sbt/setup-sbt@v1
      - name: Publish the core locally
        run: sbt coreJVM/publishM2
      - name: Integration tests
        working-directory: maven-plugin
        run: ./mvnw -B verify

  mill-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # The plugin resolves the core from the local Ivy repository until it is on Maven Central.
      - name: Publish the core locally
        run: sbt coreJVM/publishLocal
      - name: Unit and integration tests
        working-directory: mill-plugin
        run: ./mill --ticker false __.testForked

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pre-commit
      - name: Hooks end to end
        run: scripts/pre-commit-e2e.sh

  # The command line contract on a real process, on every runtime. CmdApiSpec runs in the test JVM
  # and cannot see locale, streams or exit codes.
  cli-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Build the three runtimes
        run: sbt -batch cliJS/fastLinkJS cliNative/nativeLink cliJVM/compile
      - name: JVM
        run: |
          # sbt ends its output with ANSI control sequences on a runner, so strip them before taking the last line.
          classpath=$(sbt -batch -Dsbt.color=false --error "export cliJVM/Runtime/fullClasspath" | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | grep . | tail -1)
          scripts/cli-acceptance.sh jvm java -cp "$classpath" ww86.hocon_fmt.CmdApi
      - name: Node
        if: ${{ !cancelled() }}
        run: scripts/cli-acceptance.sh node node cli/.js/target/scala-3.8.2/hocon-formatter-cli-fastopt/main.js
      - name: Native
        if: ${{ !cancelled() }}
        run: scripts/cli-acceptance.sh native cli/.native/target/scala-3.8.2/hocon-formatter

  # Report-only: shared runners are too noisy to fail a build on. main keeps the history in
  # refs/notes/benchmarks; a pull request is compared against it in the job summary.
  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BENCH_MACHINE: github-ubuntu-latest
      # A note is a commit on refs/notes/benchmarks, and a runner has no git identity of its own.
      GIT_AUTHOR_NAME: github-actions
      GIT_AUTHOR_EMAIL: github-actions@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions
      GIT_COMMITTER_EMAIL: github-actions@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Fetch the history
        run: git fetch origin refs/notes/benchmarks:refs/notes/benchmarks || echo "no history yet"
      - name: Measure
        run: scripts/bench.py run
      - name: Report
        run: |
          {
            echo '```'
            scripts/bench.py report --commits 15
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the history
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git push origin refs/notes/benchmarks
