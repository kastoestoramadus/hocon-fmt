name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      # UPSTREAM-SCONFIG: the page runs on a sconfig fork until ekrich/sconfig releases the option
      # (#646/#647); delete this step and its cache once it does (docs/site.md, "Returning to
      # upstream sconfig"). The cache is keyed on the script, which pins the fork's sha.
      - name: Cache the sconfig fork
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.ekrich
          key: sconfig-fork-${{ hashFiles('scripts/fetch-sconfig-fork.sh') }}
      - name: Publish the sconfig fork
        run: scripts/fetch-sconfig-fork.sh

      # As in CI, Ubuntu runners supply Node for Scala.js.
      - name: Build the site
        run: sbt site/build
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/target/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
