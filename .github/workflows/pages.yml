name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Deploys only when something the site is built from changed: the site module and the core
  # it runs on, the examples the page's generators read, the sbt build that assembles the
  # page, the script that publishes the sconfig fork it builds against, and this workflow,
  # whose own change should be exercised by the next push. Anything else — including
  # docs-only commits — redeploys an unchanged page for nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.diff.outputs.site }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Enough history to diff against the previous main commit; the whole repository
          # is ~1 MiB of pack.
          fetch-depth: 0
      - name: Did anything the site is built from change?
        id: diff
        env:
          # The pull request base for a pull_request, the previous main commit for a push;
          # empty on workflow_dispatch, which always deploys.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          site=false
          # An unresolvable base (a new branch, a rewritten history) deploys rather than
          # leaving the page stale.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # The diff is captured before the loop reads it: piped straight in, a failed
            # `git diff` would feed the loop nothing and read as a docs-only change, so it
            # answers site=true instead — the same fail-open as an unresolvable base, and
            # any other error fails the step loudly. `--no-renames` lists a pure rename as
            # both of its paths: plain --name-only shows only the destination, so a core
            # file renamed into docs/ would read as docs-only and leave the page stale.
            if files=$(git diff --name-only --no-renames "$BASE" HEAD); then
              if [ -n "$files" ]; then
                while IFS= read -r file; do
                  case "$file" in
                    site/*|core/*|examples/*|build.sbt|project/*|scripts/fetch-sconfig-fork.sh|.github/workflows/pages.yml)
                      site=true; break ;;
                  esac
                done <<< "$files"
              fi
            else
              site=true
            fi
          else
            site=true
          fi
          echo "site=$site" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - name: Set up sbt
        uses: sbt/setup-sbt@v1
      # UPSTREAM-SCONFIG: the page runs on a sconfig fork until ekrich/sconfig releases the option
      # (#646/#647); delete this step and its cache once it does (docs/site.md, "Returning to
      # upstream sconfig"). The cache is keyed on the script, which pins the fork's sha.
      - name: Cache the sconfig fork
        uses: actions/cache@v4
        with:
          path: ~/.ivy2/local/org.ekrich
          key: sconfig-fork-${{ hashFiles('scripts/fetch-sconfig-fork.sh') }}
      - name: Publish the sconfig fork
        run: scripts/fetch-sconfig-fork.sh

      # As in CI, Ubuntu runners supply Node for Scala.js.
      - name: Build the site
        run: sbt site/build
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/target/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
