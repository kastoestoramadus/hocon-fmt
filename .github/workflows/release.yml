name: Release

# A version tag builds the native binaries, their wheels, the npm package and the web script and
# attaches them to a GitHub release. Run by hand, it builds the same artifacts without releasing anything, which is
# how to try the matrix before tagging. Publishing to Maven Central, PyPI, npm and the Gradle Plugin
# Portal needs credentials this repository does not hold yet, so it is not automated here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    name: native binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-latest,     target: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Link
        run: sbt cliNative/nativeLink
      - name: Smoke test
        run: |
          binary=cli/.native/target/scala-3.8.2/hocon-fmt
          printf 'a   =   1\n' > smoke.conf
          if "$binary" --check smoke.conf; then echo "check passed on an unformatted file"; exit 1; fi
          "$binary" smoke.conf && [ "$(cat smoke.conf)" = "a: 1" ]
      # The wheel behind the pre-commit hooks; its platform tag comes from the binary itself.
      - name: Wheel
        run: python3 python/build_wheel.py --binary cli/.native/target/scala-3.8.2/hocon-fmt
      - run: mv cli/.native/target/scala-3.8.2/hocon-fmt "hocon-fmt-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hocon-fmt-${{ matrix.target }}
          path: |
            hocon-fmt-${{ matrix.target }}
            hocon_fmt-*.whl

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Pack
        run: |
          sbt cliJS/npmPackage
          npm pack cli/.js/target/npm-package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: hocon-fmt-*.tgz

  # The playground's script, fetched by release so a page pins the formatter it runs.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt web/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: web-script
          path: web/target/bundle/hocon-fmt.js

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, npm, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes hocon-fmt-* hocon_fmt-*.whl hocon-fmt.js
