name: Release

# Wave 1 signs and uploads the JVM artifacts, sbt 1.x and Maven plugins to Central Portal
# (awaiting the owner's Publish click), and the Gradle plugin to the Plugin Portal when its
# credentials exist. Manual runs default to a dry run: build and sign, upload nothing.
# RELEASE_WAVE unset or 1 selects wave 1; 2 enables the later jobs. A repository variable
# gates tag pushes too, where workflow_dispatch inputs do not exist.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and sign without any uploads (disable only on a version tag)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Wave 2: the native binaries and the wheel each carries. A tag runs them once RELEASE_WAVE=2;
  # the wheel behind the pre-commit hooks and the binary behind the GitHub release are wave-2
  # channels (PyPI, the release attachments).
  native:
    if: vars.RELEASE_WAVE == '2'
    name: native binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-latest,     target: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1
      - name: Link
        run: sbt cliNative/nativeLink
      - name: Smoke test
        run: |
          binary=cli/.native/target/scala-3.9.0/hocon-fmt
          printf 'a   =   1\n' > smoke.conf
          if "$binary" --check smoke.conf; then echo "check passed on an unformatted file"; exit 1; fi
          "$binary" smoke.conf && [ "$(cat smoke.conf)" = "a = 1" ]
      # The wheel behind the pre-commit hooks; its platform tag comes from the binary itself.
      - name: Wheel
        run: python3 python/build_wheel.py --binary cli/.native/target/scala-3.9.0/hocon-fmt
      - run: mv cli/.native/target/scala-3.9.0/hocon-fmt "hocon-fmt-${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hocon-fmt-${{ matrix.target }}
          path: |
            hocon-fmt-${{ matrix.target }}
            hocon_fmt-*.whl

  # Wave 2: the npm package for the Node pre-commit hooks.
  npm:
    if: vars.RELEASE_WAVE == '2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1
      - name: Pack
        run: |
          sbt cliJS/npmPackage
          npm pack cli/.js/target/npm-package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: hocon-fmt-*.tgz

  # Wave 2: the playground's script, fetched by release so a page pins the formatter it runs.
  web:
    if: vars.RELEASE_WAVE == '2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1
      - run: sbt web/bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-script
          path: web/target/bundle/hocon-fmt.js

  # Wave 2: attaching the wave-2 artifacts to the GitHub release the tag names.
  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run && vars.RELEASE_WAVE == '2'
    # central is where the version and signing checks run; a tag they reject must not ship a release.
    needs: [native, npm, web, central]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes hocon-fmt-* hocon_fmt-*.whl hocon-fmt.js

  # Tag ancestry and version checks need no secrets, so they run without the environment
  # below: an unmerged tag or one that disagrees with the files fails before anyone is asked
  # to approve anything.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Tag is on main's history
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main; then
            echo "::error::Release tag commit is not on main's history."
            exit 1
          fi
      - name: Tag matches the versions this wave publishes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_WAVE: ${{ vars.RELEASE_WAVE || '1' }}
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME#v}"

  # All wave-1 builds and signing checks run before uploads. The private Maven repository
  # supplies the Java API and core before their first Central deployment is published.
  # Maven uses the existing Central Portal extension to produce a repository-layout bundle,
  # not a plain Maven deploy endpoint. Both Central deployments await manual publication.
  #
  # `environment: release` makes every run that reads the secrets, a tag push or a manual run,
  # wait for the owner's approval (Settings → Environments → release).
  central:
    needs: version
    environment: release
    # A hung upload must not hold the secrets for the default six hours.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: -Xmx3g
      MAVEN_REPO_LOCAL: ${{ github.workspace }}/m2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1
      - name: Import the signing key
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: printf '%s' "$PGP_SECRET" | base64 -d | gpg --batch --import
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build the wave-1 dependencies locally
        run: sbt -Dmaven.repo.local="$MAVEN_REPO_LOCAL" coreJVM/publishM2 javaApi/publishM2
      - name: Signing check, sbt
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt -Dmaven.repo.local="$MAVEN_REPO_LOCAL" signRelease && find . -name '*.asc' -not -path './node_modules/*' | grep -q .
      - name: Signing check, Maven
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          cd maven-plugin
          ./mvnw -B -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -Prelease verify
          ls target/*.asc
      - name: Build and sign, Gradle
        working-directory: gradle-plugin
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: ./gradlew --no-daemon --no-configuration-cache -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -PreleaseSigning check publishToMavenLocal
      - name: Upload mode
        env:
          CAN_UPLOAD: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
          RELEASE_WAVE: ${{ vars.RELEASE_WAVE || '1' }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [ "$CAN_UPLOAD" != true ]; then
            echo "Dry run: all wave-1 artifacts built and signed; no registry uploads."
          elif [ -z "$GRADLE_PUBLISH_KEY" ] || [ -z "$GRADLE_PUBLISH_SECRET" ]; then
            if [ "$RELEASE_WAVE" = 2 ]; then
              message="Wave 2 requires GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET for Plugin Portal; no registry uploads were started."
              echo "::error::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            else
              message="Wave 1: skipping Plugin Portal upload because GRADLE_PUBLISH_KEY or GRADLE_PUBLISH_SECRET is missing. Central uploads will continue."
              echo "::warning::$message"
              echo "$message" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Upload, sbt
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt -Dmaven.repo.local="$MAVEN_REPO_LOCAL" publishRelease
      - name: Upload, Maven
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          # Quoted, so Maven and not the shell expands the variables.
          cat > "$RUNNER_TEMP/settings.xml" <<'XML'
          <settings><servers><server>
            <id>central</id>
            <username>${env.SONATYPE_USERNAME}</username>
            <password>${env.SONATYPE_PASSWORD}</password>
          </server></servers></settings>
          XML
          cd maven-plugin && ./mvnw -B -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -s "$RUNNER_TEMP/settings.xml" -Prelease -DskipTests -Dinvoker.skip deploy
      - name: Upload, Gradle (or explain why skipped)
        env:
          CAN_UPLOAD: ${{ startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        working-directory: gradle-plugin
        run: |
          if [ -z "$GRADLE_PUBLISH_KEY" ] || [ -z "$GRADLE_PUBLISH_SECRET" ]; then
            echo "Skipping Plugin Portal upload: GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET are both required."
          elif [ "$CAN_UPLOAD" != true ]; then
            echo "Skipping Plugin Portal upload: dry run (credentials are not used)."
          else
            ./gradlew --no-daemon --no-configuration-cache -Dmaven.repo.local="$MAVEN_REPO_LOCAL" -PreleaseSigning publishPlugins
          fi
      # On hold until Mill supports Scala 3.9 (see docs/releasing.md); `false &&` keeps the step and its secrets wiring.
      - name: Upload, Mill
        if: false && startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_WAVE == '2'
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          sbt coreJVM/publishLocal
          cd mill-plugin && ./mill mill.javalib.SonatypeCentralPublishModule/publishAll --publishArtifacts __.publishArtifacts --shouldRelease false
