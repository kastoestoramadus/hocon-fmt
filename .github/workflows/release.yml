name: Release

# A version tag publishes what the wave ships to Maven Central, and — in wave 2 — builds the
# native binaries, their wheels, the npm package and the web script and attaches them to a GitHub
# release. Run by hand, it builds and signs the same artifacts without releasing anything, which
# is how to try the wave before tagging. Every Central deployment waits for a click on Publish;
# the Gradle Plugin Portal, PyPI and npm are not automated here yet.
#
# How much a run ships is one switch, the repository variable RELEASE_WAVE (Settings → Secrets
# and variables → Actions → Variables): unset or 1 ships wave 1 only — the JVM artifacts sbt
# publishes: core, cats, cli, the Java API and the sbt plugin, this repository's first publish —
# and 2 turns the wave-2 jobs and uploads below back on. A repository variable, and not a
# workflow_dispatch input, because it must gate tag pushes, where no input exists; and not a
# single env at the top, because a job-level `if` cannot read a workflow-level `env`, while it
# reads `vars`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Wave 2: the native binaries and the wheel each carries. A tag runs them once RELEASE_WAVE=2;
  # the wheel behind the pre-commit hooks and the binary behind the GitHub release are wave-2
  # channels (PyPI, the release attachments).
  native:
    if: vars.RELEASE_WAVE == '2'
    name: native binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-aarch64 }
          - { os: macos-latest,     target: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Link
        run: sbt cliNative/nativeLink
      - name: Smoke test
        run: |
          binary=cli/.native/target/scala-3.8.2/hocon-fmt
          printf 'a   =   1\n' > smoke.conf
          if "$binary" --check smoke.conf; then echo "check passed on an unformatted file"; exit 1; fi
          "$binary" smoke.conf && [ "$(cat smoke.conf)" = "a = 1" ]
      # The wheel behind the pre-commit hooks; its platform tag comes from the binary itself.
      - name: Wheel
        run: python3 python/build_wheel.py --binary cli/.native/target/scala-3.8.2/hocon-fmt
      - run: mv cli/.native/target/scala-3.8.2/hocon-fmt "hocon-fmt-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: hocon-fmt-${{ matrix.target }}
          path: |
            hocon-fmt-${{ matrix.target }}
            hocon_fmt-*.whl

  # Wave 2: the npm package for the Node pre-commit hooks.
  npm:
    if: vars.RELEASE_WAVE == '2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Pack
        run: |
          sbt cliJS/npmPackage
          npm pack cli/.js/target/npm-package
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: hocon-fmt-*.tgz

  # Wave 2: the playground's script, fetched by release so a page pins the formatter it runs.
  web:
    if: vars.RELEASE_WAVE == '2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt web/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: web-script
          path: web/target/bundle/hocon-fmt.js

  # Wave 2: attaching the wave-2 artifacts to the GitHub release the tag names.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_WAVE == '2'
    needs: [native, npm, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes hocon-fmt-* hocon_fmt-*.whl hocon-fmt.js

  # Signs and, on a tag, uploads what the current wave publishes. Run by hand it only proves the
  # signing key and its passphrase work, and uploads nothing; a tag goes on to upload, and each
  # deployment is left in the portal, validated, until someone clicks Publish. Wave 1 is the sbt
  # deployment alone; the Maven signing check and the Maven and Mill uploads wait for
  # RELEASE_WAVE=2, since their builds resolve the core from the local repositories sbt fills
  # here, where it is not on Central until the first deployment is published.
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Tag matches the versions this wave publishes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_WAVE: ${{ vars.RELEASE_WAVE || '1' }}
        run: scripts/check-release-version.sh "${GITHUB_REF_NAME#v}"
      - name: Import the signing key
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: printf '%s' "$PGP_SECRET" | base64 -d | gpg --batch --import
      - name: Signing check, sbt
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt signRelease && find . -name '*.asc' -not -path './node_modules/*' | grep -q .
      - name: Signing check, Maven
        if: vars.RELEASE_WAVE == '2'
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          sbt coreJVM/publishM2 javaApi/publishM2
          (cd maven-plugin && ./mvnw -B -Prelease -DskipTests -Dinvoker.skip verify && ls target/*.asc)
      - name: Upload, sbt
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt publishRelease
      - name: Upload, Maven
        if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_WAVE == '2'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          # Quoted, so Maven and not the shell expands the variables.
          cat > "$RUNNER_TEMP/settings.xml" <<'XML'
          <settings><servers><server>
            <id>central</id>
            <username>${env.SONATYPE_USERNAME}</username>
            <password>${env.SONATYPE_PASSWORD}</password>
          </server></servers></settings>
          XML
          cd maven-plugin && ./mvnw -B -s "$RUNNER_TEMP/settings.xml" -Prelease -DskipTests -Dinvoker.skip deploy
      - name: Upload, Mill
        if: startsWith(github.ref, 'refs/tags/v') && vars.RELEASE_WAVE == '2'
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PGP_SECRET }}
          MILL_PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          sbt coreJVM/publishLocal
          cd mill-plugin && ./mill mill.javalib.SonatypeCentralPublishModule/publishAll --publishArtifacts __.publishArtifacts --shouldRelease false
